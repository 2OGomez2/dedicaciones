<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff0f3;
            margin: 0;
            overflow-x: hidden;
            color: #444;
        }

        /* Efecto de corazones de fondo */
        .heart {
            position: fixed;
            color: #ff4d6d;
            font-size: 20px;
            z-index: -1;
            user-select: none;
            animation: move 3s linear forwards;
        }

        @keyframes move {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #ff4d6d;
            margin: 0;
        }

        .galeria {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .foto-card {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 50px;
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.8s ease-out;
        }

        /* Clase para activar animación al hacer scroll */
        .show {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .foto-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 15px;
            /* MEJORAS DE CALIDAD */
            image-rendering: -webkit-optimize-contrast; /* Mejora el contraste y nitidez en navegadores modernos */
            object-fit: cover; /* Asegura que la imagen llene el contenedor sin deformarse */
            filter: brightness(0.9); /* Ligeramente más oscura por defecto */
            transition: filter 0.3s ease;
        
        }

        .foto-card:hover img {
            filter: brightness(1); /* Brillo total al interactuar */
        }



        .texto {
            padding: 15px;
            font-size: 1.1rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <h1>Para alguien especial</h1>
        <p>Baja un poquito... 👇</p>
    </header>

    <div class="galeria">
        <div class="foto-card">
            <img src="foto1.jpg" alt="Foto 1">
            <div class="texto">tu primer mensaje lleno de sentimiento.</div>
        </div>

        <div class="foto-card">
            <img src="foto2.jpg" alt="Foto 2">
            <div class="texto">Y aquí otro recuerdo inolvidable.</div>
        </div>

        <div class="foto-card">
            <img src="foto3.jpg" alt="Foto 3">
            <div class="texto"> foto del viaje en moto.</div>
        </div>
    </div>

    <script>
        // Función para crear corazones
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 4000);
        }
        setInterval(createHeart, 300);

        // Animación de aparición al bajar
        const cards = document.querySelectorAll('.foto-card');
        window.addEventListener('scroll', () => {
            cards.forEach(card => {
                const top = card.getBoundingClientRect().top;
                if (top < window.innerHeight - 100) {
                    card.classList.add('show');
                }
            });
        });
    </script>
</body>
</html>
