<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff0f3;
            margin: 0;
            overflow-x: hidden;
            color: #444;
        }

        /* Reproductor Flotante */
        .reproductor {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
            z-index: 10001;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #ff4d6d;
        }

        #titulo-cancion {
            font-size: 0.75rem;
            color: #ff4d6d;
            font-weight: bold;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-audio {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* Efecto de corazones de fondo */
        .heart {
            position: fixed;
            top: -10vh;
            font-size: 2rem;
            pointer-events: none;
            z-index: 9999;
            user-select: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
           0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 1; }
           100% { transform: translateY(110vh) translateX(100px) rotate(360deg); opacity: 0; }
        }

        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #ff4d6d;
            margin: 0;
        }

        .galeria {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 100px; /* Espacio para que el reproductor no tape la última foto */
        }

        .foto-card {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 50px;
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.8s ease-out;
            cursor: pointer; 
        }

        .show {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .foto-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 15px;
            image-rendering: -webkit-optimize-contrast;
            object-fit: cover;
            filter: brightness(0.9);
            transition: filter 0.3s ease;
        }

        .foto-card:hover img { filter: brightness(1); }

        .texto {
            padding: 15px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .foto-card:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <header>
        <h1>Para alguien especial</h1>
        <p>Baja un poquito... 👇</p>
    </header>

    <div class="galeria">
        <div class="foto-card">
            <img src="foto1.jpg" alt="Foto 1">
            <div class="texto">Prueba de pagina wed personal</div>
        </div>

        <div class="foto-card">
            <img src="foto2.jpg" alt="Foto 2">
            <div class="texto">Y aquí otro recuerdo inolvidable.</div>
        </div>

        <div class="foto-card">
            <img src="foto3.jpg" alt="Foto 3">
            <div class="texto">Primera foto.</div>
        </div>

        <div class="foto-card">
            <img src="foto4.jpg" alt="Foto 4">
            <div class="texto">Primera foto.</div>
        </div>

        <div class="foto-card">
            <img src="foto5.jpg" alt="Foto 5">
            <div class="texto">Primera foto.</div>
        </div>

        <div class="foto-card">
            <img src="foto6.jpg" alt="Foto 6">
            <div class="texto">Primera foto.</div>
        </div>
    </div>

    <div class="reproductor">
        <button class="btn-audio" onclick="togglePlay()" id="btn-play">▶️</button>
        <span id="titulo-cancion">Música desactivada</span>
        <audio id="mi-audio"></audio>
    </div>

    <script>
    const cards = document.querySelectorAll('.foto-card');
    const audio = document.getElementById('mi-audio');
    const btnPlay = document.getElementById('btn-play');
    const tituloCancion = document.getElementById('titulo-cancion');

    // CONFIGURACIÓN DE PLAYLIST ALEATORIA
    const totalCanciones = 27; // Cambia esto si tienes más o menos
    let playlist = [];
    for (let i = 1; i <= totalCanciones; i++) {
        playlist.push(`Musica-lista/${i}.mp3`); // Tus archivos deben llamarse 1.mp3, 2.mp3...
    }

    function reproducirSiguienteAleatoria() {
        const index = Math.floor(Math.random() * playlist.length);
        audio.src = playlist[index];
        audio.volume = 0.6; // Volumen al 60% para que sea de fondo
        
        // Mostrar qué número de canción suena
        tituloCancion.innerText = "Sonando: Melodía #" + (index + 1);
        
        audio.play().catch(e => console.log("Clic necesario para sonar"));
        btnPlay.innerText = "⏸️";
    }

    function togglePlay() {
        if (audio.paused) {
            if(!audio.src) reproducirSiguienteAleatoria();
            else audio.play();
            btnPlay.innerText = "⏸️";
        } else {
            audio.pause();
            btnPlay.innerText = "▶️";
        }
    }

    // Al terminar una canción, salta a otra aleatoria
    audio.addEventListener('ended', reproducirSiguienteAleatoria);

    // Función para lluvia de corazones
    function lluviaDeCorazones() {
        const cantidad = 30;
        for (let i = 0; i < cantidad; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                const duracion = Math.random() * 2 + 2;
                heart.style.animationDuration = duracion + 's';
                heart.style.fontSize = Math.random() * 1.5 + 1 + 'rem';
                document.body.appendChild(heart);
                setTimeout(() => { heart.remove(); }, duracion * 1000);
            }, i * 50);
        }
    }

    // EVENTOS EN LAS FOTOS
    cards.forEach(card => {
        card.addEventListener('click', () => {
            // Si la música no ha empezado, inicia una canción random
            if (!audio.src || audio.paused) {
                reproducirSiguienteAleatoria();
            }
            lluviaDeCorazones();
        });
    });

    window.addEventListener('scroll', () => {
        cards.forEach(card => {
            const top = card.getBoundingClientRect().top;
            if (top < window.innerHeight - 100) {
                card.classList.add('show');
            }
        });
    });
    </script>   
</body>
</html>
